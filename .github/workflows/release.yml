name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify release version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install . build twine cyclonedx-bom coverage ruff pip-audit
      - name: Validate quality gates
        run: |
          python -m ruff check tdn_protheus_mcp tests examples
          python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage report --fail-under=75
          python -m pip_audit
      - name: Build release assets
        run: |
          mkdir -p dist
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m cyclonedx_py environment --output-file dist/sbom.cdx.json --of JSON
          cd dist
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "TDN Protheus MCP ${GITHUB_REF_NAME}"
