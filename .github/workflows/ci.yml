name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip "setuptools>=83" && python -m pip install . build twine cyclonedx-bom coverage ruff pip-audit
      - name: Static analysis
        run: python -m ruff check tdn_protheus_mcp tests examples --output-format=github
      - name: Run tests with coverage
        run: python -m coverage run --branch -m unittest discover -s tests -p "test_*.py" -v
      - name: Coverage report
        run: python -m coverage report --fail-under=75
      - name: Audit installed runtime package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip_audit
      - name: Verify generic MCP stdio client interface
        run: python examples/mcp_smoke_client.py --help
      - name: Build and validate Python distributions
        run: python -m build && python -m twine check dist/*.whl dist/*.tar.gz
      - name: Generate SBOM
        run: python -m cyclonedx_py environment --output-file dist/sbom.cdx.json --of JSON
      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
